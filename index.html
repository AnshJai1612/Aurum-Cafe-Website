<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum Restaurant & Cafe | Al Furjan</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap');
        
        :root {
            --gold: #C9A84C; --gold-lt: #E8C97A;
            --ch: #111; --ch2: #1c1c1c; --cr: #F5F0E8; --mu: #88887f;
            --serif: 'Cormorant Garamond', Georgia, serif;
            --sans: 'DM Sans', sans-serif;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        body { background: var(--ch); color: var(--cr); font-family: var(--sans); overflow-x: hidden; }

        /* Smooth Reveal Animations */
        .rv { opacity: 0; transform: translateY(28px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
        .rv.in { opacity: 1; transform: none; }
        .rv.d1 { transition-delay: .1s; } .rv.d2 { transition-delay: .22s; }

        @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        .shimmer {
            background: linear-gradient(90deg, var(--gold) 25%, var(--gold-lt) 50%, var(--gold) 75%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
        }

        @keyframes kb { 0% { transform: scale(1); } 100% { transform: scale(1.07); } }
        .kb { animation: kb 20s ease-in-out infinite alternate; }
        
        .ghost { position: absolute; font-family: var(--serif); font-size: clamp(80px, 13vw, 170px); color: rgba(201,168,76,.04); z-index: 0; pointer-events: none; }
        
        .mc { transition: transform .3s; border: 1px solid rgba(201,168,76,.1); }
        .mc:hover { transform: translateY(-5px); border-color: var(--gold); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const IMG = {
            hero: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1920&q=80",
            story: "https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=900&q=80",
            mBreak: "https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=1400&q=75",
            mLunch: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=1400&q=75",
            mDinner: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=1400&q=75",
            mCoffee: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=1400&q=75",
            g1: "https://images.unsplash.com/photo-1550966871-3ed3cba5831f?w=900&q=75",
            g2: "https://images.unsplash.com/photo-1484723091739-30a097e8f929?w=600&q=75"
        };

        const MENU_DATA = {
            Breakfast: [
                { name: "Saffron Ricotta Toast", desc: "Whipped ricotta, saffron honey, candied walnuts.", price: "AED 55" },
                { name: "Shakshuka Al Furjan", desc: "Slow-simmered tomato ragout, spiced eggs.", price: "AED 62" }
            ],
            Lunch: [
                { name: "Wagyu Beef Sliders", desc: "Truffle aioli, caramelized onion, brioche.", price: "AED 128" }
            ],
            Dinner: [
                { name: "Black Truffle Risotto", desc: "Carnaroli rice, aged parmesan, Périgord truffle.", price: "AED 185" }
            ]
        };

        function App() {
            const [activeTab, setActiveTab] = useState('Breakfast');

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className="fixed w-full z-50 p-6 flex justify-between items-center bg-[#111]/80 backdrop-blur-md border-b border-[#C9A84C]/10">
                        <div className="font-serif text-2xl tracking-widest text-[#C9A84C]">AURUM</div>
                        <div className="hidden md:flex gap-8 text-[10px] uppercase tracking-[0.3em]">
                            <a href="#story" className="hover:text-[#C9A84C]">Story</a>
                            <a href="#menu" className="hover:text-[#C9A84C]">Menu</a>
                            <a href="#gallery" className="hover:text-[#C9A84C]">Gallery</a>
                        </div>
                        <button className="bg-[#C9A84C] text-[#111] px-6 py-2 text-[10px] font-bold uppercase tracking-widest">Reserve</button>
                    </nav>

                    {/* Hero Section */}
                    <section className="relative h-screen flex items-center justify-center overflow-hidden">
                        <img src={IMG.hero} className="absolute inset-0 w-full h-full object-cover kb" alt="Hero" />
                        <div className="absolute inset-0 bg-black/50" />
                        <div className="relative text-center z-10 px-6">
                            <h1 className="text-7xl md:text-9xl font-serif shimmer mb-4">Aurum</h1>
                            <p className="italic text-xl text-white/70 max-w-lg mx-auto">Where community warmth meets refined dining.</p>
                        </div>
                    </section>

                    {/* Story Section */}
                    <section id="story" className="py-24 px-6 relative bg-[#111]">
                        <span className="ghost top-10 right-10">01</span>
                        <div className="max-w-4xl mx-auto grid md:grid-cols-2 gap-12 items-center">
                            <div className="rv in">
                                <h2 className="text-5xl font-serif mb-6">The Meaning of <span className="text-[#C9A84C]">Aurum</span></h2>
                                <p className="text-[#88887f] leading-relaxed mb-6">Latin for gold — it is our promise. Not just in color, but in the quality of every grain of coffee and every fold of pastry served here in Al Furjan.</p>
                                <div className="h-1 w-20 bg-[#C9A84C]" />
                            </div>
                            <img src={IMG.story} className="rounded-sm shadow-2xl" alt="Story" />
                        </div>
                    </section>

                    {/* Menu Section */}
                    <section id="menu" className="py-24 px-6 bg-[#1c1c1c] relative">
                        <span className="ghost top-10 left-10">02</span>
                        <div className="max-w-5xl mx-auto text-center mb-12">
                            <h2 className="text-5xl font-serif mb-4">The <span className="text-[#C9A84C]">Menu</span></h2>
                            <div className="flex justify-center gap-6 border-b border-[#C9A84C]/20 mb-12">
                                {Object.keys(MENU_DATA).map(tab => (
                                    <button 
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        className={`pb-4 text-[10px] uppercase tracking-widest ${activeTab === tab ? 'text-[#C9A84C] border-b-2 border-[#C9A84C]' : 'text-[#88887f]'}`}
                                    >
                                        {tab}
                                    </button>
                                ))}
                            </div>
                            <div className="grid md:grid-cols-2 gap-6 text-left">
                                {MENU_DATA[activeTab].map((item, i) => (
                                    <div key={i} className="mc p-6 bg-[#111]">
                                        <div className="flex justify-between items-baseline mb-2">
                                            <h3 className="font-serif text-xl">{item.name}</h3>
                                            <span className="text-[#C9A84C] italic">{item.price}</span>
                                        </div>
                                        <p className="text-xs text-[#88887f]">{item.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-12 border-t border-[#C9A84C]/10 text-center bg-[#111]">
                        <div className="font-serif text-[#C9A84C] text-xl mb-4">AURUM</div>
                        <p className="text-[10px] uppercase tracking-[0.5em] text-[#88887f]">Al Furjan, Dubai | Open Daily</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
